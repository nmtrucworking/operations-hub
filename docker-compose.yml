services:
  postgres:
    image: postgres:16-alpine
    container_name: operations-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-operations_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operations123456}
      POSTGRES_DB: ${POSTGRES_DB:-operations_hub}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operations_owner} -d ${POSTGRES_DB:-operations_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
